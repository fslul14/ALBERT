[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "albert"
version = "0.0.1"
description = "Passive web vulnerability scanner — detection only, never exploits."
requires-python = ">=3.11"
authors = [{ name = "Frenki" }]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "selectolax>=0.3",
    "playwright==1.64.0",  # headless render; browser has no network of its own (core/browser.py)
    "cryptography>=42",
    "sslyze==6.3.1",  # non-intrusive TLS enumeration only (see core/tls_client.py)
    "dnspython==2.9.0",  # scope-checked DNS (core/dns_client.py)
    "PyYAML>=6.0",
    "publicsuffixlist==1.1.0.20261018",  # registrable-domain checks; bundled list, no runtime fetch
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
albert = "albert.cli:main"

[tool.setuptools.packages.find]
include = ["albert*"]

[tool.setuptools.package-data]
albert = ["rules/*.yaml", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "real_tls: use the real TLS collector (local 127.0.0.1 server only)",
    "real_dns: use the real DNS step (with an injected fake resolver)",
    "dns_guard_test: the one test allowed to trip the DNS send guard (it checks the guard)",
    "real_intel: use the real intel collector (with mocked services)",
]
filterwarnings = ["ignore:Parsed a serial number:cryptography.utils.CryptographyDeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["sslyze", "sslyze.*"]
implicit_reexport = true
